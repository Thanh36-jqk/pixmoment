name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # The app reads Blob/Redis tokens at request time, not build time, so a
      # production build compiles fine without secrets (rate limiting just logs
      # a warning). This catches type/route regressions the steps above miss.
      - name: Build
        run: npm run build
